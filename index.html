<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>豪太GAME 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ▼▼▼ デザイン設定 ▼▼▼ */
  body {
    margin: 0;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background-color: #fff8e7;
    /* 背景画像を bg.jpg に設定 */
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    color: #5a4a42;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  h1 { 
    margin: 5px 0; 
    font-size: 1.4rem; 
    color: #fff; 
    text-shadow: 2px 2px 0 #8d5524, -1px -1px 0 #8d5524, 1px -1px 0 #8d5524, -1px 1px 0 #8d5524, 1px 1px 0 #8d5524;
    flex-shrink: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* ゲーム枠 */
  #game-container {
      position: relative;
      /* JSで本家比率(1:1.4)に強制リサイズします */
      width: 90vw; 
      height: 70dvh; 
      max-width: 450px;
      max-height: 800px;
      border: 6px solid #e6cba8;
      border-radius: 20px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      overflow: visible; /* 雲がはみ出るのでvisible */
      touch-action: none;
  }

  canvas { display: block; }

  /* ▼▼▼ 雲キャラクター ▼▼▼ */
  #cloud-char {
      position: absolute;
      /* 箱の上部5%の位置に配置 */
      top: 5%; 
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px; height: 50px;
      background: #fff;
      border-radius: 50px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: none; /* 最初は非表示 */
      z-index: 20;
      pointer-events: none;
  }
  #cloud-char::before, #cloud-char::after {
      content: ''; position: absolute; background: #fff; border-radius: 50%;
  }
  #cloud-char::before { width: 40px; height: 40px; top: -15px; left: 10px; }
  #cloud-char::after { width: 35px; height: 35px; top: -10px; right: 10px; }
  /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

  /* NEXT表示 */
  #next-area {
      position: absolute;
      top: 10px; right: 10px;
      width: 60px; height: 70px;
      background: #fff;
      border: 3px solid #ffb347;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      pointer-events: none;
      z-index: 10;
  }
  #next-label { font-size: 10px; font-weight: bold; color: #ffb347; margin-bottom: 2px; }
  #next-ball-preview {
      width: 35px; height: 35px;
      border-radius: 50%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: 2px solid #fff8e7;
  }

  /* スコア */
  #score-board {
      position: absolute;
      top: 10px; left: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff8ba7;
      text-shadow: 1px 1px 0 #fff;
      pointer-events: none;
      z-index: 10;
  }
  #score-label { font-size: 0.8rem; color: #8d5524; }

  /* ローディング */
  #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fff8e7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s;
      border-radius: 15px; /* 角丸に合わせる */
  }
  .spinner {
      width: 40px; height: 40px;
      border: 5px solid #e6cba8;
      border-top: 5px solid #ffb347;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* ゲームオーバー画面 */
  #game-over-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 248, 231, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      border-radius: 15px;
  }
  #game-over-title { font-size: 2rem; color: #ff7f7f; margin-bottom: 20px; font-weight: bold; }
  #retry-btn {
      padding: 15px 40px;
      font-size: 1.2rem;
      background: #ffb347;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      box-shadow: 0 4px 0 #e5a23d;
  }
  #retry-btn:active { transform: translateY(4px); box-shadow: none; }

  /* ▼▼▼ デンジャーライン（本家仕様：上から20%） ▼▼▼ */
  #danger-line {
      position: absolute;
      top: 20%; 
      left: 0;
      width: 100%;
      height: 0;
      border-top: 3px dotted rgba(255, 100, 100, 0.4);
      pointer-events: none;
      z-index: 5;
      transition: border-color 0.2s;
  }
  .danger-active {
      border-top: 3px solid rgba(255, 0, 0, 1) !important;
  }

</style>
</head>
<body>

<h1>🐾 豪太GAME 🐶</h1>

<div id="game-container">
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>準備中だワン...✂️</div>
    </div>

    <div id="game-over-screen">
        <div id="game-over-title">GAME OVER</div>
        <div style="font-size: 1.5rem; margin-bottom: 20px;">Score: <span id="final-score">0</span></div>
        <button id="retry-btn" onclick="location.reload()">もう一度！</button>
    </div>

    <div id="score-board">
        <span id="score-label">Score</span><br>
        <span id="score">0</span>
    </div>
    
    <div id="next-area">
        <div id="next-label">NEXT</div>
        <div id="next-ball-preview"></div>
    </div>
    
    <div id="danger-line"></div>
    <div id="cloud-char"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
  // ▼▼▼ 【本家完全一致】サイズ比率 (直径) ▼▼▼
  const SIZE_RATIOS = [
      0.068, // Lv1: さくらんぼ (6.8%)
      0.093, // Lv2: いちご
      0.125, // Lv3: ぶどう
      0.137, // Lv4: デコポン
      0.175, // Lv5: かき
      0.206, // Lv6: りんご
      0.237, // Lv7: なし
      0.312, // Lv8: もも
      0.375, // Lv9: パイナップル
      0.481, // Lv10: メロン
      0.600  // Lv11: スイカ (60%)
  ];

  // ▼▼▼ 11色カラー枠 ▼▼▼
  const BORDER_COLORS = [
      '#ff5252', // Lv1 赤
      '#ff4081', // Lv2 ピンク
      '#e040fb', // Lv3 紫
      '#ffab40', // Lv4 山吹
      '#ff6e40', // Lv5 オレンジ
      '#d50000', // Lv6 深紅
      '#c6ff00', // Lv7 ライム
      '#f48fb1', // Lv8 桜色
      '#ffd600', // Lv9 黄色
      '#76ff03', // Lv10 緑
      '#00c853'  // Lv11 濃緑
  ];

  const FRUIT_IMAGES = [
      '1.png', '2.png', '3.png', '4.png', '5.png', '6.png', 
      '7.png', '8.png', '9.png', '10.png', '11.png'
  ];

  const { Engine, Render, Runner, World, Bodies, Body, Events, Composite } = Matter;

  let engine, render, runner;
  let currentBall = null;
  let currLevelIndex = 0; 
  let nextLevelIndex = 0; 
  
  let canDrop = false;
  let isDragging = false;
  let score = 0;
  let gameWidth, gameHeight;
  let isGameOver = false;
  let dangerTimer = 0;
  
  let audioCtx = null;
  let spawnY = 0; // 雲とボールの出現Y座標
  
  let fruitLevels = [];
  const circularImages = {}; 

  const container = document.getElementById('game-container');
  const scoreEl = document.getElementById('score');
  const nextPreviewEl = document.getElementById('next-ball-preview');
  const loadingScreen = document.getElementById('loading-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const finalScoreEl = document.getElementById('final-score');
  const dangerLineEl = document.getElementById('danger-line');
  const cloudChar = document.getElementById('cloud-char');

  // --- 0. 効果音 (Type B: 明るい電子音) ---
  function initAudio() {
      if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
          audioCtx.resume();
      }
  }

  function playSound(type, level = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'drop') {
          // 「ポッ！」
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
      } else if (type === 'merge') {
          // 「ピロリン♪」
          osc.type = 'triangle';
          const baseFreq = 500 + (level * 100);
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.linearRampToValueAtTime(baseFreq + 200, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
      }
  }

  // --- 1. 画面サイズ計算 (本家比率 1:1.4) ---
  function calculateGameSize() {
      const maxWidth = Math.min(window.innerWidth * 0.95, 450);
      const maxHeight = window.innerHeight * 0.85;

      // 黄金比率 1 : 1.4
      let w = maxWidth;
      let h = w * 1.4; 

      if (h > maxHeight) {
          h = maxHeight;
          w = h / 1.4;
      }

      gameWidth = w;
      gameHeight = h;
      
      // 出現位置は上から5%
      spawnY = gameHeight * 0.05;
      // 雲の表示位置調整
      cloudChar.style.top = `${spawnY}px`;

      container.style.width = `${gameWidth}px`;
      container.style.height = `${gameHeight}px`;

      fruitLevels = SIZE_RATIOS.map((ratio, index) => {
          return {
              level: index + 1,
              radius: (gameWidth * ratio) / 2,
              img: FRUIT_IMAGES[index],
              color: BORDER_COLORS[index]
          };
      });
  }

  // --- 2. 画像処理 ---
  async function preloadAndCropImages() {
      calculateGameSize();

      const promises = fruitLevels.map((fruit, index) => {
          return new Promise((resolve) => {
              const img = new Image();
              img.crossOrigin = "Anonymous";
              img.src = fruit.img;
              
              img.onload = () => {
                  const scaleFactor = 3; // 3倍高画質
                  const targetRadius = fruit.radius * scaleFactor;
                  const canvasSize = targetRadius * 2;
                  // ▼▼▼ 修正: 枠の太さ 5% ▼▼▼
                  const borderWidth = targetRadius * 0.05; 
                  
                  const canvas = document.createElement('canvas');
                  canvas.width = canvasSize;
                  canvas.height = canvasSize;
                  const ctx = canvas.getContext('2d');

                  ctx.beginPath();
                  ctx.arc(canvasSize/2, canvasSize/2, canvasSize/2, 0, Math.PI * 2);
                  ctx.closePath();
                  ctx.clip(); 

                  const sourceSize = Math.min(img.width, img.height);
                  const sx = (img.width - sourceSize) / 2;
                  const sy = (img.height - sourceSize) / 2;
                  ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, canvasSize, canvasSize);

                  // 枠描画
                  ctx.beginPath();
                  ctx.arc(canvasSize/2, canvasSize/2, canvasSize/2 - borderWidth/2, 0, Math.PI * 2); 
                  ctx.lineWidth = borderWidth;
                  ctx.strokeStyle = fruit.color;
                  ctx.stroke();

                  circularImages[index] = canvas.toDataURL();
                  resolve();
              };
              img.onerror = () => {
                  circularImages[index] = null;
                  resolve();
              };
          });
      });
      
      await Promise.all(promises);
      
      loadingScreen.style.opacity = 0;
      setTimeout(() => {
          loadingScreen.style.display = 'none';
          initGame();
      }, 500);
  }

  // --- 3. ゲーム初期化 ---
  function initGame() {
      engine = Engine.create();
      engine.world.gravity.y = 0.58; // 本家重力

      render = Render.create({
          element: container,
          engine: engine,
          options: {
              width: gameWidth,
              height: gameHeight,
              wireframes: false,
              background: 'transparent',
              pixelRatio: window.devicePixelRatio
          }
      });

      const wallThickness = 500;
      const walls = [
          Bodies.rectangle(gameWidth/2, gameHeight + wallThickness/2, gameWidth + wallThickness*2, wallThickness, { isStatic: true, render: { fillStyle: '#e6cba8' } }),
          Bodies.rectangle(-wallThickness/2, gameHeight/2, wallThickness, gameHeight*2, { isStatic: true, render: { opacity: 0 } }),
          Bodies.rectangle(gameWidth + wallThickness/2, gameHeight/2, wallThickness, gameHeight*2, { isStatic: true, render: { opacity: 0 } })
      ];
      World.add(engine.world, walls);

      Render.run(render);
      runner = Runner.create();
      Runner.run(runner, engine);
      
      Events.on(engine, 'collisionStart', handleCollision);
      Events.on(engine, 'afterUpdate', checkGameOver);

      currLevelIndex = Math.floor(Math.random() * 5);
      nextLevelIndex = Math.floor(Math.random() * 5);
      
      updateNextView();
      spawnReadyBall();
  }

  // --- 4. ボール作成 ---
  function createFruit(x, y, index, isStatic = false) {
      const fruit = fruitLevels[index];
      const texture = circularImages[index];

      return Bodies.circle(x, y, fruit.radius, {
          isStatic: isStatic,
          label: 'fruit_' + index,
          // ▼▼▼ 本家物理設定 ▼▼▼
          restitution: 0.15, 
          friction: 0.01,
          frictionAir: 0.001,
          density: 0.001 * (index + 1),
          // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲
          render: {
              sprite: texture ? {
                  texture: texture,
                  xScale: 1 / 3, 
                  yScale: 1 / 3
              } : { fillStyle: fruit.color } 
          }
      });
  }

  function updateNextView() {
      const texture = circularImages[nextLevelIndex];
      if (texture) {
          nextPreviewEl.style.backgroundImage = `url(${texture})`;
          nextPreviewEl.style.backgroundColor = 'transparent';
      } else {
          nextPreviewEl.style.backgroundImage = 'none';
          nextPreviewEl.style.backgroundColor = '#ffb347';
      }
  }

  function spawnReadyBall() {
      if (currentBall || isGameOver) return;
      currentBall = createFruit(gameWidth/2, spawnY, currLevelIndex, true);
      currentBall.collisionFilter = { group: -1, category: 0x0002, mask: 0x0000 }; 
      World.add(engine.world, currentBall);
      canDrop = true;
      isDragging = false;

      cloudChar.style.display = 'flex';
      updateCloudPosition(gameWidth/2);
  }

  // --- 5. 操作 ---
  const handleStart = (e) => {
      initAudio();
      if (!canDrop || !currentBall || isGameOver) return;
      e.preventDefault();
      isDragging = true;
      moveBall(e);
  };

  const handleMove = (e) => {
      if (!canDrop || !currentBall || !isDragging || isGameOver) return;
      e.preventDefault();
      moveBall(e);
  };

  const handleEnd = (e) => {
      if (!canDrop || !currentBall || !isDragging || isGameOver) return;
      e.preventDefault();
      isDragging = false;
      dropBall();
  };

  function moveBall(e) {
      let clientX;
      if (e.type.startsWith('touch')) {
          clientX = e.touches[0].clientX;
      } else {
          clientX = e.clientX;
      }
      const rect = container.getBoundingClientRect();
      const x = clientX - rect.left;
      
      const fruit = fruitLevels[currLevelIndex];
      const minX = fruit.radius + 2;
      const maxX = gameWidth - fruit.radius - 2;
      const clampedX = Math.max(minX, Math.min(maxX, x));
      
      Body.setPosition(currentBall, { x: clampedX, y: spawnY });
      updateCloudPosition(clampedX);
  }

  function updateCloudPosition(x) {
      cloudChar.style.left = `${x}px`;
  }

  function dropBall() {
      playSound('drop');
      Body.setStatic(currentBall, false);
      currentBall.collisionFilter = { group: 0, category: 0x0001, mask: 0xFFFFFFFF };
      currentBall = null;
      canDrop = false;
      cloudChar.style.display = 'none';

      currLevelIndex = nextLevelIndex;
      nextLevelIndex = Math.floor(Math.random() * 5); 
      
      updateNextView();
      setTimeout(spawnReadyBall, 600);
  }

  container.addEventListener('touchstart', handleStart, { passive: false });
  container.addEventListener('touchmove', handleMove, { passive: false });
  container.addEventListener('touchend', handleEnd, { passive: false });
  container.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  // --- 6. 合体 ---
  function handleCollision(event) {
      if (isGameOver) return;
      const pairs = event.pairs;
      for (let i = 0; i < pairs.length; i++) {
          const bodyA = pairs[i].bodyA;
          const bodyB = pairs[i].bodyB;

          if (bodyA.label.startsWith('fruit_') && bodyB.label === bodyA.label) {
              const level = parseInt(bodyA.label.split('_')[1]);

              if (level < fruitLevels.length - 1) {
                  const midX = (bodyA.position.x + bodyB.position.x) / 2;
                  const midY = (bodyA.position.y + bodyB.position.y) / 2;

                  World.remove(engine.world, [bodyA, bodyB]);
                  const newBall = createFruit(midX, midY, level + 1);
                  World.add(engine.world, newBall);
                  
                  playSound('merge', level);
                  score += (level + 1) * 2;
                  scoreEl.textContent = score;
                  break; 
              }
          }
      }
  }

  // --- 7. ゲームオーバー判定 (ライン上20%) ---
  function checkGameOver() {
      if (isGameOver) return;

      const bodies = Composite.allBodies(engine.world);
      const dangerY = gameHeight * 0.2; // 上から20%の位置
      dangerLineEl.style.top = `${dangerY}px`; // ライン描画位置も更新

      let isDanger = false;

      for (const body of bodies) {
          if (!body.isStatic && body !== currentBall) {
              // 半径の半分がラインを超えたらアウト
              if (body.position.y - body.circleRadius * 0.5 < dangerY) {
                  isDanger = true;
                  break;
              }
          }
      }

      if (isDanger) {
          dangerLineEl.classList.add('danger-active');
          dangerTimer++;
          if (dangerTimer > 180) { // 3秒
              gameOver();
          }
      } else {
          dangerLineEl.classList.remove('danger-active');
          dangerTimer = 0;
      }
  }

  function gameOver() {
      isGameOver = true;
      Runner.stop(runner);
      finalScoreEl.innerText = score;
      gameOverScreen.style.display = 'flex';
  }

  preloadAndCropImages();

</script>
</body>
</html>
