<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>豪太Game 🚂💨✋</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;900&display=swap" rel="stylesheet">
<style>
  /* ▼▼▼ デザイン設定：相撲と電車の融合 ▼▼▼ */
  body {
    margin: 0;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    /* 土俵の砂の色 */
    background-color: #f4ebd0;
    /* 線路のイメージ（枕木）を背景パターンに */
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 19px,
      #d7ccc8 19px,
      #d7ccc8 20px
    );
    overflow: hidden;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    color: #3e2723;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  h1 { 
    margin: 10px 0; 
    font-size: 1.5rem; 
    /* 電車ブルーと相撲レッド */
    background: linear-gradient(to right, #1a237e, #c62828);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    flex-shrink: 0;
    pointer-events: none;
    font-weight: 900;
    letter-spacing: 2px;
  }

  #game-container {
      position: relative;
      /* 土俵の「徳俵」をイメージした濃い茶色の枠 */
      border: 8px solid #5d4037;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      /* 踏切のような縞模様の影 */
      box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
      overflow: hidden;
      touch-action: none;
  }

  canvas { display: block; }

  #next-area {
      position: absolute;
      top: 10px; right: 10px;
      width: 65px; height: 75px;
      background: #fff;
      /* 電車の窓枠のようなデザイン */
      border: 4px solid #3949ab;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #1a237e;
      pointer-events: none;
      z-index: 10;
  }
  #next-label { 
      font-size: 11px; 
      font-weight: 900; 
      background: #ffeb3b; /* 警告色 */
      color: #000;
      padding: 1px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
  }
  #next-ball-preview {
      width: 40px; height: 40px;
      border-radius: 50%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: 2px solid #f4ebd0;
  }

  #score-board {
      position: absolute;
      top: 10px; left: 15px;
      font-size: 1.8rem;
      font-weight: 900;
      color: #c62828; /* 番付表のような赤 */
      text-shadow: 2px 2px 0 #fff;
      pointer-events: none;
      z-index: 10;
      transform: rotate(-2deg); /* 勢いをつける */
  }
  #score-label { 
      font-size: 0.9rem; 
      color: #3e2723; 
      background: #fff;
      padding: 0 5px;
      border: 2px solid #3e2723;
  }

  #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #f4ebd0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      font-weight: bold;
      color: #5d4037;
  }
  .spinner {
      width: 50px; height: 50px;
      border: 6px solid #d7ccc8;
      border-top: 6px solid #c62828; /* 赤 */
      border-left: 6px solid #1a237e; /* 青 */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  #game-over-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(244, 235, 208, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
  }
  #game-over-title { 
      font-size: 2.5rem; 
      color: #c62828; 
      margin-bottom: 10px; 
      font-weight: 900;
      text-shadow: 3px 3px 0 #fff;
  }
  #retry-btn {
      padding: 15px 50px;
      font-size: 1.4rem;
      background: #1a237e; /* 紺色 */
      color: #fff;
      border: 4px solid #fff;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 900;
      box-shadow: 0 6px 0 #000051;
      transition: transform 0.1s;
  }
  #retry-btn:active { transform: translateY(6px); box-shadow: none; }

  #danger-line {
      position: absolute;
      top: 100px; 
      left: 0;
      width: 100%;
      height: 0;
      border-top: 4px dotted rgba(255, 0, 0, 0.4);
      pointer-events: none;
      z-index: 5;
  }
  .danger-active {
      border-top: 4px solid #ff0000 !important;
  }

</style>
</head>
<body>

<h1>🚂 豪太Game ✋</h1>

<div id="game-container">
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>はっけよい...準備中！</div>
    </div>

    <div id="game-over-screen">
        <div id="game-over-title">勝負あり！</div>
        <div style="font-size: 1.5rem; margin-bottom: 30px; font-weight: bold; color:#5d4037;">
            決まり手: <span id="final-score" style="font-size: 2rem; color:#c62828;">0</span> 点
        </div>
        <button id="retry-btn" onclick="location.reload()">もう一番！</button>
    </div>

    <div id="score-board">
        <span id="score-label">番付</span><br>
        <span id="score">0</span>
    </div>
    
    <div id="next-area">
        <div id="next-label">次はコレ</div>
        <div id="next-ball-preview"></div>
    </div>
    
    <div id="danger-line"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
  // ▼▼▼ サイズ比率（変更なし） ▼▼▼
  const SIZE_RATIOS = [
      0.10, 0.13, 0.16, 0.19, 0.23, 
      0.28, 0.33, 0.40, 0.48, 0.53, 0.58
  ];

  // ▼▼▼ 画像ファイル名を 1.png 〜 11.png に指定 ▼▼▼
  // ※ 全部豪太くんの画像を用意してください
  const FRUIT_IMAGES = [
      '1.png', '2.png', '3.png', '4.png', '5.png', '6.png', 
      '7.png', '8.png', '9.png', '10.png', '11.png'
  ];

  const { Engine, Render, Runner, World, Bodies, Body, Events, Composite } = Matter;

  let engine, render, runner;
  let currentBall = null;
  let currLevelIndex = 0; 
  let nextLevelIndex = 0; 
  
  let canDrop = false;
  let isDragging = false;
  let score = 0;
  let gameWidth, gameHeight;
  let isGameOver = false;
  let dangerTimer = 0;
  
  let fruitLevels = [];
  const circularImages = {}; 

  const container = document.getElementById('game-container');
  const scoreEl = document.getElementById('score');
  const nextPreviewEl = document.getElementById('next-ball-preview');
  const loadingScreen = document.getElementById('loading-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const finalScoreEl = document.getElementById('final-score');
  const dangerLineEl = document.getElementById('danger-line');

  // --- 画面サイズ計算 ---
  function calculateGameSize() {
      const maxWidth = Math.min(window.innerWidth * 0.95, 450);
      const maxHeight = window.innerHeight * 0.85;

      let w = maxWidth;
      let h = w * 1.5;

      if (h > maxHeight) {
          h = maxHeight;
          w = h / 1.5;
      }

      gameWidth = w;
      gameHeight = h;

      container.style.width = `${gameWidth}px`;
      container.style.height = `${gameHeight}px`;

      fruitLevels = SIZE_RATIOS.map((ratio, index) => {
          return {
              level: index + 1,
              radius: (gameWidth * ratio) / 2,
              img: FRUIT_IMAGES[index]
          };
      });
  }

  // --- 画像処理 ---
  async function preloadAndCropImages() {
      calculateGameSize();

      const promises = fruitLevels.map((fruit, index) => {
          return new Promise((resolve) => {
              const img = new Image();
              img.src = fruit.img;
              
              img.onload = () => {
                  const scaleFactor = 3; 
                  const targetRadius = fruit.radius * scaleFactor;
                  const canvasSize = targetRadius * 2;
                  
                  const canvas = document.createElement('canvas');
                  canvas.width = canvasSize;
                  canvas.height = canvasSize;
                  const ctx = canvas.getContext('2d');

                  ctx.beginPath();
                  ctx.arc(canvasSize/2, canvasSize/2, canvasSize/2, 0, Math.PI * 2);
                  ctx.closePath();
                  ctx.clip(); 

                  const sourceSize = Math.min(img.width, img.height);
                  const sx = (img.width - sourceSize) / 2;
                  const sy = (img.height - sourceSize) / 2;

                  ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, canvasSize, canvasSize);

                  circularImages[index] = canvas.toDataURL();
                  resolve();
              };
              img.onerror = () => {
                  // 画像がない場合はエラーにならず、ただの色の玉になるように
                  circularImages[index] = null;
                  resolve();
              };
          });
      });
      
      await Promise.all(promises);
      
      loadingScreen.style.opacity = 0;
      setTimeout(() => {
          loadingScreen.style.display = 'none';
          initGame();
      }, 500);
  }

  // --- ゲーム初期化 ---
  function initGame() {
      engine = Engine.create();
      engine.world.gravity.y = 0.8; 

      render = Render.create({
          element: container,
          engine: engine,
          options: {
              width: gameWidth,
              height: gameHeight,
              wireframes: false,
              background: 'transparent',
              pixelRatio: window.devicePixelRatio
          }
      });

      const wallThickness = 500;
      const walls = [
          Bodies.rectangle(gameWidth/2, gameHeight + wallThickness/2, gameWidth + wallThickness*2, wallThickness, { isStatic: true, render: { fillStyle: '#5d4037' } }),
          Bodies.rectangle(-wallThickness/2, gameHeight/2, wallThickness, gameHeight*2, { isStatic: true, render: { opacity: 0 } }),
          Bodies.rectangle(gameWidth + wallThickness/2, gameHeight/2, wallThickness, gameHeight*2, { isStatic: true, render: { opacity: 0 } })
      ];
      World.add(engine.world, walls);

      Render.run(render);
      runner = Runner.create();
      Runner.run(runner, engine);
      
      Events.on(engine, 'collisionStart', handleCollision);
      Events.on(engine, 'afterUpdate', checkGameOver);

      // 出現はLv1〜Lv5
      currLevelIndex = Math.floor(Math.random() * 5);
      nextLevelIndex = Math.floor(Math.random() * 5);
      
      updateNextView(); 
      spawnReadyBall(); 
  }

  // --- ボール作成 ---
  function createFruit(x, y, index, isStatic = false) {
      const fruit = fruitLevels[index];
      const texture = circularImages[index];

      return Bodies.circle(x, y, fruit.radius, {
          isStatic: isStatic,
          label: 'fruit_' + index,
          restitution: 0.2,
          friction: 0.1, 
          density: 0.001,
          render: {
              sprite: texture ? {
                  texture: texture,
                  xScale: 1 / 3, 
                  yScale: 1 / 3
              } : { fillStyle: '#c62828' } // 画像がない場合は赤色
          }
      });
  }

  // --- NEXT更新 ---
  function updateNextView() {
      const texture = circularImages[nextLevelIndex];
      if (texture) {
          nextPreviewEl.style.backgroundImage = `url(${texture})`;
          nextPreviewEl.style.backgroundColor = 'transparent';
      } else {
          nextPreviewEl.style.backgroundImage = 'none';
          nextPreviewEl.style.backgroundColor = '#c62828';
      }
  }

  function spawnReadyBall() {
      if (currentBall || isGameOver) return;
      currentBall = createFruit(gameWidth/2, 50, currLevelIndex, true);
      currentBall.collisionFilter = { group: -1, category: 0x0002, mask: 0x0000 }; 
      World.add(engine.world, currentBall);
      canDrop = true;
      isDragging = false;
  }

  // --- 操作 ---
  const handleStart = (e) => {
      if (!canDrop || !currentBall || isGameOver) return;
      e.preventDefault();
      isDragging = true;
      moveBall(e);
  };

  const handleMove = (e) => {
      if (!canDrop || !currentBall || !isDragging || isGameOver) return;
      e.preventDefault();
      moveBall(e);
  };

  const handleEnd = (e) => {
      if (!canDrop || !currentBall || !isDragging || isGameOver) return;
      e.preventDefault();
      isDragging = false;
      dropBall();
  };

  function moveBall(e) {
      let clientX;
      if (e.type.startsWith('touch')) {
          clientX = e.touches[0].clientX;
      } else {
          clientX = e.clientX;
      }
      const rect = container.getBoundingClientRect();
      const x = clientX - rect.left;
      
      const fruit = fruitLevels[currLevelIndex];
      const minX = fruit.radius + 5;
      const maxX = gameWidth - fruit.radius - 5;
      const clampedX = Math.max(minX, Math.min(maxX, x));
      Body.setPosition(currentBall, { x: clampedX, y: 50 });
  }

  function dropBall() {
      Body.setStatic(currentBall, false);
      currentBall.collisionFilter = { group: 0, category: 0x0001, mask: 0xFFFFFFFF };
      currentBall = null;
      canDrop = false;

      currLevelIndex = nextLevelIndex;
      nextLevelIndex = Math.floor(Math.random() * 5);
      
      updateNextView();
      setTimeout(spawnReadyBall, 600);
  }

  container.addEventListener('touchstart', handleStart, { passive: false });
  container.addEventListener('touchmove', handleMove, { passive: false });
  container.addEventListener('touchend', handleEnd, { passive: false });
  container.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  // --- 合体 ---
  function handleCollision(event) {
      if (isGameOver) return;
      const pairs = event.pairs;
      for (let i = 0; i < pairs.length; i++) {
          const bodyA = pairs[i].bodyA;
          const bodyB = pairs[i].bodyB;

          if (bodyA.label.startsWith('fruit_') && bodyB.label === bodyA.label) {
              const level = parseInt(bodyA.label.split('_')[1]);

              if (level < fruitLevels.length - 1) {
                  const midX = (bodyA.position.x + bodyB.position.x) / 2;
                  const midY = (bodyA.position.y + bodyB.position.y) / 2;

                  World.remove(engine.world, [bodyA, bodyB]);
                  const newBall = createFruit(midX, midY, level + 1);
                  World.add(engine.world, newBall);

                  score += (level + 1) * 2;
                  scoreEl.textContent = score;
                  break; 
              }
          }
      }
  }

  // --- ゲームオーバー ---
  function checkGameOver() {
      if (isGameOver) return;

      const bodies = Composite.allBodies(engine.world);
      const dangerY = 100; 
      let isDanger = false;

      for (const body of bodies) {
          if (!body.isStatic && body !== currentBall) {
              if (body.position.y - body.circleRadius * 0.5 < dangerY) {
                  isDanger = true;
                  break;
              }
          }
      }

      if (isDanger) {
          dangerLineEl.classList.add('danger-active');
          dangerTimer++;
          if (dangerTimer > 180) { // 3秒
              gameOver();
          }
      } else {
          dangerLineEl.classList.remove('danger-active');
          dangerTimer = 0;
      }
  }

  function gameOver() {
      isGameOver = true;
      Runner.stop(runner);
      finalScoreEl.innerText = score;
      gameOverScreen.style.display = 'flex';
  }

  preloadAndCropImages();

</script>
</body>
</html>
